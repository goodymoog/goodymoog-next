<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Cicadas in Balladur</title>
  <link rel="icon" type="image/png" href="balladur-favicon.png?v=11">
  <link rel="apple-touch-icon" href="balladur-touch.png?v=11">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

  <style>
    :root { color-scheme:dark; }
    *, *::before, *::after { box-sizing:border-box; }
    html, body { margin:0; padding:0; width:100%; height:100%; background:#000 !important; overflow:hidden; }
    body { color:#f4f4f3; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; }
    #canvas { display:block; width:100%; height:100%; background:#000; outline:none; touch-action:none; }
    #balladur-loader {
      position:fixed; inset:0; z-index:9999; background:#000 !important;
      display:flex; align-items:center; justify-content:center; flex-direction:column;
      padding:32px 20px; text-align:center; opacity:1;
      transition:opacity .28s linear; isolation:isolate;
    }
    #balladur-loader.leaving { opacity:0; pointer-events:none; }
    .loader-content { width:min(860px,92vw); margin:auto; display:flex; align-items:center; flex-direction:column; }
    .game-title {
      margin:0 0 28px;
      color:#d4af5a;
      font-family:"Cinzel Decorative", Georgia, "Times New Roman", serif;
      font-weight:700;
      line-height:1.1;
      text-transform:none;
      text-align:center;
    }
    .game-title .title-first {
      display:block;
      font-size:clamp(19px,2vw,29px);
      letter-spacing:.075em;
      margin-bottom:3px;
    }
    .game-title .title-last {
      display:block;
      font-size:clamp(32px,4.4vw,58px);
      letter-spacing:.055em;
    }
    .film { position:relative; display:flex; justify-content:center; align-items:center;
      width:min(820px,90vw); aspect-ratio:1770 / 660; max-height:43vh; background:#000;
      pointer-events:none; }
    #chase, #chase-poster { width:100%; height:100%; max-height:43vh; object-fit:contain; display:block; background:#000; }
    #chase-poster { display:none; }
    #balladur-loader.video-failed #chase { display:none; }
    #balladur-loader.video-failed #chase-poster { display:block; }
    .loading-footer { width:min(420px,74vw); margin:25px auto 0; }
    #load-message { margin:0 0 13px; color:#aaa; font-size:11px; font-weight:500;
      letter-spacing:.19em; line-height:1.5; text-transform:uppercase; }
    #meter { position:relative; width:100%; height:2px; overflow:hidden; background:#303030; }
    #fill { position:absolute; top:0; left:0; height:100%; width:33%; background:#dedede;
      animation:travel 1.7s ease-in-out infinite alternate; }
    #balladur-loader.determinate #fill { animation:none; transition:width .18s linear; }
    #balladur-loader.determinate #fill::after { content:""; position:absolute; right:0; top:0;
      width:24px; height:100%; background:#fff; opacity:.7; }
    #balladur-loader.stalled #fill { animation:subtlePulse 1.4s ease-in-out infinite; }
    @keyframes travel { from { left:0; } to { left:67%; } }
    @keyframes subtlePulse { 0%,100% { opacity:.45; } 50% { opacity:1; } }
    #credit { margin:28px 0 0; color:#929292; font-size:12px; font-weight:400;
      letter-spacing:.015em; line-height:1.5; }
    #load-error { display:none; margin-top:18px; max-width:75vw;
      color:#efb1b1; white-space:pre-wrap; font:13px/1.5 Arial, sans-serif; }
    #balladur-loader.failed #load-error { display:block; }
    #balladur-loader.failed #load-message, #balladur-loader.failed #meter { display:none; }
    @media (max-height:650px) {
      #balladur-loader { padding:10px 16px; }
      .game-title { margin-bottom:10px; }
      .film, #chase, #chase-poster { max-height:35vh; }
      .loading-footer { margin-top:10px; }
      #credit { margin-top:15px; }
    }
    @media (prefers-reduced-motion:reduce) {
      #fill { animation:none; }
      #balladur-loader { transition:none; }
    }
  </style>
</head>
<body>
  <canvas id="canvas">A browser with canvas support is required.</canvas>
  <div id="balladur-loader" role="status" aria-label="Loading Cicadas in Balladur">
    <main class="loader-content">
      <h1 class="game-title"><span class="title-first">Cicadas In</span><span class="title-last">Balladur</span></h1>
      <div class="film" aria-hidden="true">
        <video id="chase" autoplay loop muted playsinline disablepictureinpicture preload="auto" poster="loading-chase-poster.jpg">
          <source src="loading-chase.mp4" type="video/mp4">
        </video>
        <img id="chase-poster" src="loading-chase-poster.jpg" alt="">
      </div>
      <div class="loading-footer">
        <div id="load-message">Loading</div>
        <div id="meter" role="progressbar" aria-label="Game loading progress"><div id="fill"></div></div>
      </div>
      <p id="credit">Game Design and Music by Théo Heron</p>
      <div id="load-error" role="alert"></div>
    </main>
  </div>
  <script src="index.js"></script>
  <script>
  (function () {
    'use strict';
    // Godot fills these two placeholders on export. This is a Custom HTML Shell.
    const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":10375324,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const loader = document.getElementById('balladur-loader');
    const video = document.getElementById('chase');
    const message = document.getElementById('load-message');
    const fill = document.getElementById('fill');
    const meter = document.getElementById('meter');
    const error = document.getElementById('load-error');
    const startedAt = performance.now();
    let finished = false;
    let downloading = false;
    let lastProgressAt = startedAt;

    video.addEventListener('error', function () { loader.classList.add('video-failed'); }, true);
    const playback = video.play();
    if (playback && typeof playback.catch === 'function') {
      playback.catch(function () { /* The poster stays available. */ });
    }
    // Don't claim the download is advancing if Godot is busy compiling.
    const check = setInterval(function () {
      if (finished) { clearInterval(check); return; }
      loader.classList.toggle('stalled', downloading && performance.now() - lastProgressAt > 1800);
    }, 450);

    function onProgress(current, total) {
      if (finished) return;
      if (total > 0 && Number.isFinite(current) && current >= 0 && current < total) {
        const pct = Math.min(99, Math.round(100 * current / total));
        downloading = true;
        lastProgressAt = performance.now();
        loader.classList.add('determinate');
        loader.classList.remove('stalled');
        fill.style.width = pct + '%';
        message.textContent = 'Loading · ' + pct + '%';
        meter.setAttribute('aria-valuenow', String(pct));
      } else if (total > 0 && current >= total) {
        downloading = false;
        loader.classList.remove('determinate','stalled');
        fill.style.width = '33%';
        meter.removeAttribute('aria-valuenow');
        message.textContent = 'Starting game';
      }
    }

    function onError(e) {
      finished = true;
      clearInterval(check);
      console.error('Cicadas in Balladur failed to start:', e);
      loader.classList.add('failed');
      error.textContent = 'Unable to start game.\n' + (e && e.message ? e.message : String(e));
    }

    if (typeof Engine === 'undefined') {
      onError(new Error('Missing Godot engine JavaScript. Re-export all Web files together.'));
      return;
    }
    const missing = Engine.getMissingFeatures({ threads: false });
    if (missing.length) {
      onError(new Error('Unsupported browser features: ' + missing.join(', ')));
      return;
    }
    new Engine(config).startGame({onProgress: onProgress}).then(function () {
      finished = true;
      clearInterval(check);
      loader.classList.remove('stalled');
      loader.classList.add('determinate');
      fill.style.width = '100%';
      message.textContent = 'Ready';
      video.pause();
      setTimeout(function () {
        loader.classList.add('leaving');
        setTimeout(function () { loader.remove(); }, 300);
      }, Math.max(0, 500 - (performance.now() - startedAt)));
    }).catch(onError);
  })();
  </script>
</body>
</html>
