<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Cicadas in Balladur</title>
<link rel="icon" type="image/png" sizes="any" href="balladur-favicon.png?v=5">
<link rel="apple-touch-icon" href="balladur-touch.png?v=5">

<style>
  :root { color-scheme: dark; }
  * { box-sizing:border-box; }
  html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
  body { color:#f5f1e8; font-family:Georgia,"Times New Roman",serif; }
  #canvas { display:block; width:100%;height:100%;outline:none;touch-action:none; }
  #status { position:fixed; z-index:100; inset:0; background:#000; display:flex;
            flex-direction:column; align-items:center; justify-content:center;
            padding:18px; transition:opacity .25s ease; }
  #status.leaving { opacity:0; pointer-events:none; }
  #chase { display:block; width:min(1062px,94vw); max-height:58vh; aspect-ratio:1770 / 660;
           height:auto; object-fit:contain; background:#000; }
  #load-state { text-align:center; font-size:clamp(16px,2.15vw,23px);
                font-weight:normal; letter-spacing:.01em; line-height:1.4;
                margin:18px 0 0; color:#f4f0e8; }
  #status-notice { display:none; text-align:center; max-width:min(700px,92vw);
                   padding:20px; white-space:pre-wrap; color:#ffb8b8;
                   font-family:system-ui,sans-serif; font-size:16px; line-height:1.45; }
  #status.failed #status-notice { display:block; }
  #status.failed #load-state { display:none; }
  @media (max-height:500px) { #chase{max-height:55vh} #load-state{margin-top:8px} }
  @media (prefers-reduced-motion:reduce) { #chase{display:none} }
</style>
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<div id="status" role="status" aria-label="Loading Cicadas in Balladur">
  <video id="chase" autoplay loop muted playsinline preload="auto" poster="loading-chase-poster.jpg" aria-hidden="true">
    <source src="loading-chase.mp4" type="video/mp4">
  </video>
  <div id="load-state">Loading...</div>
  <div id="status-notice" role="alert"></div>
</div>
<noscript>JavaScript is required to play Cicadas in Balladur.</noscript>
<script src="index.js"></script>
<script>
(function () {
  'use strict';
  const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9623036,"index.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
  const status = document.getElementById('status');
  const loadingText = document.getElementById('load-state');
  const notice = document.getElementById('status-notice');
  const chase = document.getElementById('chase');
  document.title = 'Cicadas in Balladur';

  // Real footage of the actual in-game wizard and orc. Autoplay has no audio.
  // A real game engine cannot render its models before the WebAssembly loads.
  const playback = chase.play();
  if (playback && typeof playback.catch === 'function') playback.catch(() => {});

  function onProgress(current,total) {
    if (total > 0 && current >= 0) {
      const percentage = Math.max(0,Math.min(99,Math.round(100*current/total)));
      loadingText.textContent = 'Loading... ' + percentage + '%';
    } else {
      loadingText.textContent = 'Loading...';
    }
  }

  function onError(err) {
    console.error('Cicadas in Balladur startup error:', err);
    status.classList.add('failed');
    notice.textContent = 'Unable to start the game.\n' + (err && err.message ? err.message : String(err));
  }

  if (typeof Engine === 'undefined') { onError(new Error('Godot engine script did not load.')); return; }
  const missing = Engine.getMissingFeatures({threads:false});
  if (missing.length) { onError(new Error('Missing browser features: ' + missing.join(', '))); return; }
  const engine = new Engine(config);
  engine.startGame({onProgress:onProgress}).then(function () {
    loadingText.textContent = 'Loading... 100%';
    status.classList.add('leaving');
    chase.pause();
    setTimeout(function () { status.remove(); }, 300);
    document.title = 'Cicadas in Balladur';
  }).catch(onError);
})();
</script>
</body>
</html>
